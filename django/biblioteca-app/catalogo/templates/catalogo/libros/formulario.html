<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if form.instance.pk %}Editar Libro{% else %}Crear Libro{% endif %}</title>
</head>
<body>
    <h1>{% if form.instance.pk %}Editar Libro{% else %}Crear Libro{% endif %}</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <p>
            <button type="submit">
                Guardar Libro
            </button>
        </p>
    </form>
</body>
</html>

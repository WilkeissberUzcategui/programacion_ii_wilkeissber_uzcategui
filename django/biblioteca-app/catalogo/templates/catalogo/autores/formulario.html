<!DOCTYPE html>

<html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>{% if form.instance.pk %}Editar Autores{% else %}Crear Autores{% endif %}</title> </head> <body>

<center>
    <h1>Biblioteca</h1>
    <h2>{% if form.instance.pk %}Editar Autores{% else %}Registrar Autores{% endif %}</h2>
</center>

<hr>

<fieldset>
    <legend>Datos de la Autores</legend>

    <form method="POST">
        {% csrf_token %}

        <table cellpadding="8" align="center">
            {{ form.as_table }}

            <tr>
                <td colspan="2" align="center">
                    <button type="submit">Guardar Autores</button>

                    <button type="button">
                        <a href="{% url 'autor_list' %}">Cancelar</a>
                    </button>
                </td>
            </tr>
        </table>

    </form>
</fieldset>

<hr>

</body> </html>

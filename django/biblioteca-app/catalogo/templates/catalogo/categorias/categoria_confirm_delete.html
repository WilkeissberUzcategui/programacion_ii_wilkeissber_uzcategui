<!DOCTYPE html>

<html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Eliminar Categoría</title> </head> <body>

<center>
    <h1>Biblioteca</h1>
    <h2>Confirmar eliminación de categoría</h2>
</center>

<hr>

<fieldset>
    <legend>Confirmación</legend>

    <p>
        ¿Estás seguro de que quieres eliminar la categoría
        <strong>"{{ categoria.nombre }}"</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Eliminar</button>

        <a href="{% url 'categoria_list' %}">
            <button type="button">Cancelar</button>
        </a>
    </form>

</fieldset>

<hr>

</body> </html>
